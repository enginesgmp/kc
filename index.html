<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge Capture</title>

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">

    <h1>Knowledge Capture</h1>

    <div id="initial_card" class="card">

      <div class="field">
        <label>Nombre</label>
        <input type="text" id="person_name">
      </div>

      <div class="field">
        <label>Cargo</label>
        <input type="text" id="position">
      </div>

      <div class="field">
        <label>Área</label>
        <select id="area_select">
          <option value="">Cargando áreas...</option>
        </select>
      </div>

      <div class="field">
        <label>Nivel</label>
        <select id="level_select">
          <option value="">Cargando niveles...</option>
        </select>
      </div>

<button id="btn_continue">
  Continuar al banco de preguntas
</button>

    </div>

    <div id="status"></div>

<div id="wizard" class="wizard hidden">

  <div class="capture-header">
    <div>
      <h2>Banco de preguntas</h2>
      <p id="participant_summary"></p>
    </div>

    <div class="autosave-pill">
      <span class="dot"></span>
      <span id="autosave_text">Guardado local activo</span>
    </div>
  </div>

  <div class="progress-box">
    <div class="progress-top">
      <strong>Avance de captura</strong>
      <span id="progress_percent">0%</span>
    </div>

    <div class="progress-bar">
      <div id="progress_fill"></div>
    </div>

    <p class="progress-help">
      Responde las preguntas visibles. Tus respuestas se guardan automáticamente en este dispositivo.
    </p>
  </div>

  <div class="card question-group-card">
    <div class="group-head">
      <div>
        <h2 id="group_title">Grupo de preguntas</h2>
        <p id="group_subtitle"></p>
      </div>

      <div id="group_status" class="group-status pending">
        Pendiente
      </div>
    </div>

    <div id="questions_container"></div>

    <button id="btn_save_block" disabled>
      Complete las preguntas para continuar
    </button>
  </div>

</div>
    
  </div>

  <script src="app.js"></script>

</body>
</html>
